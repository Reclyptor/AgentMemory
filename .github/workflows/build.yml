name: Build and Publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck -x tests/*.sh

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        id: image
        run: |
          echo "name=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The build runs upstream's test suite and an offline embedding check.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: agentmemory:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test
        run: tests/smoke.sh agentmemory:ci

      # <upstream version>-<upstream commit> is the pin the cluster references.
      # The timestamped tag is immutable per build, since a rebuild of the
      # same pin can resolve newer dependencies.
      - name: Compute Tags
        id: tags
        run: |
          version="$(docker run --rm --entrypoint node agentmemory:ci -p "require('/usr/local/lib/node_modules/@agentmemory/agentmemory/package.json').version")"
          commit="$(docker inspect -f '{{ index .Config.Labels "io.github.rohitg00.agentmemory.commit" }}' agentmemory:ci)"
          echo "pin=${version}-${commit:0:7}" >> "$GITHUB_OUTPUT"
          echo "build=${version}-${commit:0:7}-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log In to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the image the smoke test ran, not a rebuild of it.
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          for tag in "${{ steps.tags.outputs.pin }}" "${{ steps.tags.outputs.build }}"; do
            docker tag agentmemory:ci "${{ steps.image.outputs.name }}:$tag"
            docker push "${{ steps.image.outputs.name }}:$tag"
          done
